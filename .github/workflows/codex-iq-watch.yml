name: codex-iq-watch

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [main]
    tags: ["codex-iq-watch-*"]
  pull_request:
    paths: ["plugins/codex-iq-watch/**", ".github/workflows/codex-iq-watch.yml"]

defaults:
  run:
    shell: bash

env:
  PLUGIN_DIR: plugins/codex-iq-watch
  TARGET: x86_64-unknown-linux-gnu

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/codex-iq-watch
      - name: fmt
        run: cargo fmt --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml --locked
      - name: UI interaction tests
        run: node --test ${{ env.PLUGIN_DIR }}/tests/ui-confirm.test.cjs
      - name: build linux binary
        run: cargo build --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml --release --locked --target ${{ env.TARGET }}
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-iq-watch-binary
          path: ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release/codex-iq-watch
          if-no-files-found: error

  package:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: actions/download-artifact@v4
        with:
          name: codex-iq-watch-binary
          path: ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release
      - name: build plugin CLI
        run: |
          git clone --depth 1 --branch v3.19.0 https://github.com/zyycn/codex-proxy-rs.git /tmp/codex-proxy-rs
          cd /tmp/codex-proxy-rs
          cargo build --manifest-path backend/Cargo.toml --release --locked -p codex-proxy-plugin-cli
      - name: package
        run: |
          chmod +x ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release/codex-iq-watch
          /tmp/codex-proxy-rs/backend/target/release/cpr-plugin package \
            --manifest ${{ env.PLUGIN_DIR }}/plugin.json \
            --binary ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release/codex-iq-watch \
            --target ${{ env.TARGET }} \
            --resource-map ui=ui \
            --output-dir ${{ env.PLUGIN_DIR }}/dist
      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: codex-iq-watch-package
          path: ${{ env.PLUGIN_DIR }}/dist/
          if-no-files-found: error
      - name: release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release/notes.md
          draft: false
          prerelease: false
          files: ${{ env.PLUGIN_DIR }}/dist/*
