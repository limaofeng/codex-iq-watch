name: codex-iq-watch

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [main, "release/codex-iq-watch-*"]
    tags: ["codex-iq-watch-*"]
  pull_request:
    paths: ["plugins/codex-iq-watch/**", ".github/workflows/codex-iq-watch.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing plugin release tag"
        required: true
        type: string

defaults:
  run:
    shell: bash

env:
  PLUGIN_DIR: plugins/codex-iq-watch
  TARGET: x86_64-unknown-linux-gnu

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      release_tag: ${{ steps.source.outputs.release_tag }}
    steps:
      - name: resolve source and release tag
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag=""
          case "$EVENT_NAME:$SOURCE_REF" in
            workflow_dispatch:*) release_tag="$INPUT_RELEASE_TAG" ;;
            push:refs/tags/*) release_tag="$SOURCE_REF_NAME" ;;
            push:refs/heads/release/*) release_tag="${SOURCE_REF_NAME#release/}" ;;
          esac
          if [[ -n "$release_tag" ]]; then
            [[ "$release_tag" == codex-iq-watch-* ]]
            git check-ref-format "refs/tags/$release_tag"
            SOURCE_REF="refs/tags/$release_tag"
          fi
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  check:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - name: check release version
        if: needs.resolve.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          version=$(python3 -c 'import json, os; print(json.load(open(os.environ["PLUGIN_DIR"] + "/plugin.json"))["version"])')
          [[ "$RELEASE_TAG" == "codex-iq-watch-$version" ]]
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugins/codex-iq-watch
      - name: fmt
        run: cargo fmt --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml -- --check
      - name: clippy
        run: cargo clippy --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: test
        run: cargo test --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml --locked
      - name: UI interaction tests
        run: node --test ${{ env.PLUGIN_DIR }}/tests/ui-confirm.test.cjs
      - name: build linux binary
        run: cargo build --manifest-path ${{ env.PLUGIN_DIR }}/Cargo.toml --release --locked --target ${{ env.TARGET }}
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-iq-watch-binary
          path: ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release/codex-iq-watch
          if-no-files-found: error

  package:
    needs: [resolve, check]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: actions/download-artifact@v4
        with:
          name: codex-iq-watch-binary
          path: ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release
      - name: build plugin CLI
        run: |
          git clone --depth 1 --branch v3.19.0 https://github.com/zyycn/codex-proxy-rs.git /tmp/codex-proxy-rs
          cd /tmp/codex-proxy-rs
          cargo build --manifest-path backend/Cargo.toml --release --locked -p codex-proxy-plugin-cli
      - name: package
        run: |
          chmod +x ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release/codex-iq-watch
          /tmp/codex-proxy-rs/backend/target/release/cpr-plugin package \
            --manifest ${{ env.PLUGIN_DIR }}/plugin.json \
            --binary ${{ env.PLUGIN_DIR }}/target/${{ env.TARGET }}/release/codex-iq-watch \
            --target ${{ env.TARGET }} \
            --resource-map ui=ui \
            --output-dir ${{ env.PLUGIN_DIR }}/dist
      - name: upload package
        uses: actions/upload-artifact@v4
        with:
          name: codex-iq-watch-package
          path: ${{ env.PLUGIN_DIR }}/dist/
          if-no-files-found: error
      - name: release assets
        if: needs.resolve.outputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          body_path: release/notes.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ env.PLUGIN_DIR }}/dist/*.tar.gz
            ${{ env.PLUGIN_DIR }}/dist/*.tar.gz.sha256
